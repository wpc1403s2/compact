[pytest]
# 在项目根目录执行 `pytest` 即可收集 tests/ 下的用例
testpaths = tests
python_files = test_*.py
python_functions = test_*
# 代码里显式使用 @pytest.mark.asyncio，因此保持 strict 模式
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# markers：network 标记的用例需要外网/API Key，可用 -m "not network" 排除
markers =
    network: 需要访问外部 LLM API 的用例（无 Key 时自动 skip）
# 本地数据库连接 Postgres 不可用时，相关用例标记为跳过而非失败
filterwarnings =
    ignore::DeprecationWarning
